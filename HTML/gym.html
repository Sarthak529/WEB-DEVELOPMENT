<!DOCTYPE html>
<html>
<head>
    <title>Gym Membership Form</title>
</head>
<body>

    <h1>Gym Membership Registration Form</h1>

    <form action="#" method="post">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <!-- Membership Details -->
        <fieldset>
            <legend>Membership Details</legend>

            <label for="plan">Select Membership Plan:</label><br>
            <select id="plan" name="plan">
                <option value="">--Choose Plan--</option>
                <option value="1month">1 Month</option>
                <option value="3months">3 Months</option>
                <option value="6months">6 Months</option>
                <option value="12months">12 Months</option>
            </select><br><br>

            <label>Preferred Workout Time:</label><br>
            <input type="checkbox" id="morning" name="time" value="Morning">
            <label for="morning">Morning</label><br>

            <input type="checkbox" id="afternoon" name="time" value="Afternoon">
            <label for="afternoon">Afternoon</label><br>

            <input type="checkbox" id="evening" name="time" value="Evening">
            <label for="evening">Evening</label><br><br>

            <label for="trainer">Personal Trainer Required?</label><br>
            <select id="trainer" name="trainer">
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>
        </fieldset>

        <br>

        <!-- Health Information -->
        <fieldset>
            <legend>Health Information</legend>

            <label for="conditions">Any Medical Conditions?</label><br>
            <textarea id="conditions" name="conditions" rows="4" cols="40"></textarea>
        </fieldset>

        <br>

        <!-- Agreement -->
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">I agree to the terms and conditions</label><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
