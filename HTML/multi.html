<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Multi-line text input -->
<textarea name="message" rows="5" cols="40" placeholder="Write your message..."></textarea>

<!-- Dropdown select -->
<select name="city">
  <option value="">-- Select City --</option>
  <option value="delhi">Delhi</option>
  <option value="mumbai">Mumbai</option>
  <option value="bangalore">Bangalore</option>
</select>

<!-- Grouped dropdown -->
<select name="course">
  <optgroup label="Frontend">
    <option value="html">HTML</option>
    <option value="css">CSS</option>
  </optgroup>
  <optgroup label="Backend">
    <option value="nodejs">Node.js</option>
  </optgroup>
</select>

<!-- Datalist (input + suggestions) -->
<input list="browsers" name="browser" placeholder="Choose a browser">
<datalist id="browsers">
  <option value="Chrome">
  <option value="Firefox">
  <option value="Safari">
  <option value="Edge">
</datalist>
<!-- required: form won't submit without it -->
<input type="email" required>

<!-- disabled: user can't interact with it -->
<input type="text" disabled value="Read only data">

<!-- readonly: user can see but not change -->
<input type="text" readonly value="Fixed value">

<!-- maxlength: limit characters -->
<input type="text" maxlength="50">

<!-- autofocus: cursor lands here on page load -->
<input type="text" autofocus>

<!-- checked: pre-checks a checkbox/radio -->
<input type="checkbox" checked>
</body>
</html>
