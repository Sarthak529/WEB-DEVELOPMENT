<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLmedia player</title>
</head>
<body>
    <table>
        <tr>
            <th>video</th>
            <th>audio</th>
            </tr>
            <tr>
                <td><ul type="square"><li><a href="1.mp4">1.mp4</a></li><li><a href="2.mp4">2.mp4</a></li><li><a href="3.mp4">3.mp4</a></li></ul></td>
                <td><ul><li><a href="1.mp3">1.mp3</a></li><li><a href="2.mp3">2.mp3</a></li><li><a href="3.mp3">3.mp3</a></li></ul></td>
            </tr>

        </table>
        <h1>my videos </h1>
        <div>
        <video src="1.mp4" width="640" height="360" controls></video>
        <video src="2.mp4" width="640" height="360" controls></ video>
        <video src="3.mp4" width="640" height="360" controls></ video>
        </div>
        <h1>my audios </h1>
        <div>
        <audio src ="1.mp3" controls></audio>
        <audio src ="2.mp3" controls></audio>
        <audio src ="3.mp3" controls></audio> 
        </div>
</body>
</html>
