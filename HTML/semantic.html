<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout </title>
</head>
<body>
    <!-- Marks the time or date -->
<time datetime="2024-01-15">January 15, 2024</time>

<!-- An important figure (image, diagram, code) with a caption -->
<figure>
  <img src="chart.png" alt="Sales chart">
  <figcaption>Fig 1: Sales growth in 2024</figcaption>
</figure>

<!-- Highlighted/relevant text (like search results) -->
<mark>search term</mark>

<!-- An abbreviation -->
<abbr title="HyperText Markup Language">HTML</abbr>

<!-- A quotation (inline) -->
<q>The best way to learn is by doing.</q>

<!-- A block quotation -->
<blockquote cite="https://source.com">
  <p>The best way to predict the future is to create it.</p>
</blockquote>

<!-- Contact information -->
<address>
  123 Main Street, Delhi, India<br>
  <a href="mailto:info@example.com">info@example.com</a>
</address>
</body>
</html>
