<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<style>
    * {
        margin: 0;
        padding: 0;
        
    }
    .box {
        background-color: rgb(89, 89, 212);
    }
    .box1{
        color : yellow;
        padding : 20px;
        margin : 20px;
        border : 2px solid black;
        height : 100px;
        width : 200px;
        box-sizing : border-box;
    }
    .box2 {
        color: rgb(105, 30, 30);
          padding : 20px;
        margin : 20px;
        border : 2px solid blue;
        height : 100px;
        width : 200px;
        box-sizing : border-box;
    }
    </style>
<body>
    <div class = "box box1">
        This is a box model example.
    </div>
    <div class = "box box2">
        This is another box.
    </div>
</body>
